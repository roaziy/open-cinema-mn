name: release

# On every push to main, release-please reads the conventional commits since the last release
# (fix: patch, feat: minor) and keeps a release PR open with the version bump and changelog.
# Merging that PR tags the commit and publishes the GitHub Release. Nothing is deployed.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
