name: ci

on:
  pull_request:
  workflow_call: # release.yml runs this on every push to main before tagging

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_cinema_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d open_cinema_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/open_cinema_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web-admin/package-lock.json
            mobile-app/package-lock.json
      - name: Shared copies are identical
        run: npm run check:shared
      - name: Install (backend)
        working-directory: backend
        run: npm ci
      - name: Install (web-admin)
        working-directory: web-admin
        run: npm ci
      - name: Install (mobile-app)
        working-directory: mobile-app
        run: npm ci
      - name: Typecheck (backend)
        working-directory: backend
        run: npm run typecheck
      - name: Lint (backend)
        working-directory: backend
        run: npm run lint
      - name: Tests (backend)
        working-directory: backend
        run: npm test
      - name: Typecheck (web-admin)
        working-directory: web-admin
        run: npm run typecheck
      - name: Lint (web-admin)
        working-directory: web-admin
        run: npm run lint
      - name: Tests (web-admin)
        working-directory: web-admin
        run: npm test
      - name: Typecheck (mobile-app)
        working-directory: mobile-app
        run: npm run typecheck
      - name: Lint (mobile-app, biome + expo)
        working-directory: mobile-app
        run: npm run lint
      - name: Tests (mobile-app)
        working-directory: mobile-app
        run: npm test
      - name: Backend production build
        working-directory: backend
        run: npm run build
      - name: Backend bundle starts (production mode)
        env:
          NODE_ENV: production
          HOST: 127.0.0.1
          PORT: 4010
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/open_cinema_test
          JWT_SECRET: ci-jwt-secret-0123456789-abcdefghijklmnop
          QR_SECRET: ci-qr-secret-0123456789-abcdefghijklmnopq
          LINK_SECRET: ci-link-secret-0123456789-abcdefghijklmn
          BFF_SECRET: ci-bff-secret-0123456789-abcdefghijklmno
          ALLOW_MOCK_PAYMENTS: 1
          DATABASE_SSL: off
          TRUST_PROXY: 1
        run: |
          set -e
          cd backend
          npm run db:migrate:prod
          ADMIN_PASSWORD=ci-admin-password-1 node dist/admin-create.js --email ci@example.com
          node dist/index.js &
          pid=$!
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4010/v1/health; then
              kill -TERM "$pid"
              wait "$pid"   # graceful shutdown must exit 0
              exit 0
            fi
            sleep 1
          done
          kill "$pid" || true
          exit 1
      - name: Web admin build
        working-directory: web-admin
        run: npm run build
        env:
          API_INTERNAL_URL: http://localhost:8080

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .github/gitleaks.toml
